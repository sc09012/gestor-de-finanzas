<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexFinance MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: #020617;
            background-image: radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.15), transparent 25%), 
                              radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: #f8fafc; 
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .input-futuristic {
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            transition: all 0.3s ease;
        }
        
        .input-futuristic:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
            outline: none;
        }

        .btn-glow {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .btn-glow:hover {
            box-shadow: 0 0 15px currentColor;
            transform: translateY(-1px);
        }

        .currency-input { text-align: right; }
        
        .neon-text-green { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.4); }
        .neon-text-red { color: #f87171; text-shadow: 0 0 10px rgba(248, 113, 113, 0.4); }
        .neon-border-green { border-color: rgba(74, 222, 128, 0.5); box-shadow: 0 0 20px rgba(74, 222, 128, 0.1); }
        .neon-border-red { border-color: rgba(248, 113, 113, 0.5); box-shadow: 0 0 20px rgba(248, 113, 113, 0.1); }

        /* Estilos de exportación PDF */
        .pdf-ocultar { display: none !important; }
        
        .pdf-export-mode { 
            background: #020617 !important; 
            color: #f8fafc !important; 
            width: 100% !important; 
            max-width: 980px !important; 
            margin: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            
}

        }
        
        .pdf-export-mode .glass-card {
            background: #0f172a !important; 
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
            border: 1px solid #1e293b !important;
        }

        .pdf-export-mode .bg-clip-text {
            background: none !important;
            -webkit-text-fill-color: #38bdf8 !important;
            color: #38bdf8 !important;
        }

        .pdf-export-mode #paneles-container {
            display: flex !important;
            flex-direction: row !important;
            gap: 1.5rem !important;
        }
        .pdf-export-mode #paneles-container > div {
            flex: 1 !important;
            width: 50% !important;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.6); }
    </style>
</head>
<body id="main-body" class="p-4 md:p-8 flex flex-col items-center justify-center min-h-screen">
    <div id="app-content" class="glass-card w-full max-w-5xl rounded-3xl p-8 relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-600 pdf-ocultar"></div>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500 tracking-tight">NexFinance</h1>
                <p class="text-slate-400 text-sm mt-1 tracking-wide uppercase">Terminal de Control Financiero v1.0</p>
            </div>
            <button onclick="descargarPDF()" class="btn-no-pdf btn-glow text-cyan-400 border border-cyan-400/50 hover:bg-cyan-950/30 px-6 py-2.5 rounded-xl font-semibold flex items-center gap-2 backdrop-blur-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Exportar Reporte
            </button>
        </div>
        
        <div class="mb-8 break-inside-avoid">
            <label for="fecha-balance" class="block text-sm font-medium text-slate-300 mb-2">Mes y año del balance (cambie con las flechas)</label>
            <input id="fecha-balance" type="month" class="input-futuristic w-full md:w-72 p-3 rounded-xl" required>
        </div>

        <div id="paneles-container" class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8 break-inside-avoid">
            <!-- Panel Ingresos -->
            <div class="glass-card p-6 rounded-2xl border border-slate-800 break-inside-avoid">
                <div class="flex items-center gap-3 mb-6 border-b border-slate-700/50 pb-4">
                    <div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_10px_#4ade80]"></div>
                    <h2 class="text-xl font-semibold text-slate-200">INGRESOS</h2>
                </div>
                <div id="ingresos-list" class="space-y-4"></div>
                <button onclick="agregarFila('ingresos')" class="btn-no-pdf mt-6 text-sm text-green-400/80 hover:text-green-400 font-medium flex items-center gap-1 transition-colors">
                    <span class="text-lg leading-none">+</span> Añadir fuente de ingreso
                </button>
            </div>
            
            <!-- Panel Gastos -->
            <div class="glass-card p-6 rounded-2xl border border-slate-800 break-inside-avoid">
                <div class="flex items-center gap-3 mb-6 border-b border-slate-700/50 pb-4">
                    <div class="w-2 h-2 rounded-full bg-red-400 shadow-[0_0_10px_#f87171]"></div>
                    <h2 class="text-xl font-semibold text-slate-200">GASTOS</h2>
                </div>
                <div id="gastos-list" class="space-y-4"></div>
                <button onclick="agregarFila('gastos')" class="btn-no-pdf mt-6 text-sm text-red-400/80 hover:text-red-400 font-medium flex items-center gap-1 transition-colors">
                    <span class="text-lg leading-none">+</span> Añadir deducción
                </button>
            </div>
        </div>

        <!-- Dashboard Resumen -->
        <div class="glass-card rounded-2xl p-8 border-t-4 transition-all duration-500 break-inside-avoid" id="resumen-panel">
            <h2 class="text-sm tracking-[0.2em] text-slate-400 uppercase text-center mb-6">Diagnóstico Financiero</h2>
            
            <div class="flex flex-col lg:flex-row items-center justify-between gap-8">
                <!-- Zona de texto -->
                <div class="w-full lg:w-2/3">
                    <div class="flex flex-row justify-around items-center gap-4 mb-6">
                        <div class="text-center w-1/3">
                            <p class="text-slate-400 mb-1 text-sm">Total Ingresos</p>
                            <p id="total-ingresos" class="text-2xl font-bold neon-text-green">$0</p>
                        </div>
                        
                        <div class="h-12 w-px bg-slate-700"></div>
                        
                        <div class="text-center w-1/3">
                            <p class="text-slate-400 mb-1 text-sm">Balance Neto</p>
                            <p id="balance-final" class="text-4xl font-bold tracking-tight">$0</p>
                        </div>

                        <div class="h-12 w-px bg-slate-700"></div>
                        
                        <div class="text-center w-1/3">
                            <p class="text-slate-400 mb-1 text-sm">Total Gastos</p>
                            <p id="total-gastos" class="text-2xl font-bold neon-text-red">$0</p>
                        </div>
                    </div>

                    <div class="mt-4 pt-4 border-t border-slate-800 text-center">
                        <p id="mensaje-estado" class="inline-block px-4 py-1.5 rounded-full text-sm font-medium tracking-wide border"></p>
                    </div>
                </div>

                <!-- Contenedor del Gráfico -->
                <div class="w-full lg:w-1/3 flex justify-center border-t lg:border-t-0 lg:border-l border-slate-800 pt-6 lg:pt-0 lg:pl-6">
                    <div class="relative w-44 h-44">
                        <canvas id="grafico-balance"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chartInstancia = null;

        // Configuración inicial del gráfico
        const inicializarGrafico = () => {
            const ctx = document.getElementById('grafico-balance').getContext('2d');
            
            chartInstancia = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Sin datos'],
                    datasets: [{
                        data: [0.1],
                        backgroundColor: ['rgba(255,255,255,0.05)'],
                        borderColor: ['rgba(255,255,255,0.1)'],
                        borderWidth: 2,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 },
                    cutout: '65%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if(context.label === 'Sin datos') return ' Añada montos';
                                    
                                    const valor = context.raw;
                                    let label = context.label || '';
                                    
                                    // Calcula el porcentaje exacto sobre el volumen total de la torta
                                    const total = context.chart._metasets[context.datasetIndex].total;
                                    const porcentaje = ((valor / total) * 100).toFixed(1);
                                    
                                    return ` ${label}: $${new Intl.NumberFormat('es-CO').format(valor)} (${porcentaje}%)`;
                                }
                            }
                        }
                    }
                }
            });
        };

        const formatearMoneda = (valor) => {
            if (!valor) return '';
            const numero = parseInt(valor.replace(/\D/g, ''), 10);
            if (isNaN(numero)) return '';
            return new Intl.NumberFormat('es-CO').format(numero);
        };

        const desformatearMoneda = (valor) => {
            return parseInt(valor.replace(/\D/g, ''), 10) || 0;
        };

        const actualizarTotales = () => {
            let totalIngresos = 0;
            let totalGastos = 0;

            document.querySelectorAll('.input-ingreso').forEach(input => {
                totalIngresos += desformatearMoneda(input.value);
            });

            document.querySelectorAll('.input-gasto').forEach(input => {
                totalGastos += desformatearMoneda(input.value);
            });

            const balance = totalIngresos - totalGastos;

            document.getElementById('total-ingresos').textContent = '$' + new Intl.NumberFormat('es-CO').format(totalIngresos);
            document.getElementById('total-gastos').textContent = '$' + new Intl.NumberFormat('es-CO').format(totalGastos);
            
            const balanceEl = document.getElementById('balance-final');
            const panelEl = document.getElementById('resumen-panel');
            const mensajeEl = document.getElementById('mensaje-estado');
            
            balanceEl.textContent = '$' + new Intl.NumberFormat('es-CO').format(balance);

            if (balance >= 0) {
                panelEl.className = 'glass-card rounded-2xl p-8 border-t-4 transition-all duration-500 neon-border-green border-t-green-400 break-inside-avoid';
                balanceEl.className = 'text-4xl font-bold tracking-tight neon-text-green';
                mensajeEl.textContent = 'ESTADO: SUPERÁVIT DETECTADO';
                mensajeEl.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-medium tracking-wide bg-green-500/10 text-green-400 border border-green-500/20';
            } else {
                panelEl.className = 'glass-card rounded-2xl p-8 border-t-4 transition-all duration-500 neon-border-red border-t-red-400 break-inside-avoid';
                balanceEl.className = 'text-4xl font-bold tracking-tight neon-text-red';
                mensajeEl.textContent = 'ESTADO: ALERTA DE DÉFICIT';
                mensajeEl.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-medium tracking-wide bg-red-500/10 text-red-400 border border-red-500/20';
            }

            // --- NUEVA LÓGICA DEL GRÁFICO POR CONCEPTOS ---
            if (chartInstancia) {
                let labels = [];
                let chartData = [];
                let bgColors = [];
                let borderColors = [];
                
                // Variedad de tonos para diferenciar múltiples conceptos
                const greens = ['rgba(74, 222, 128, 0.4)', 'rgba(34, 197, 94, 0.4)', 'rgba(22, 163, 74, 0.4)', 'rgba(21, 128, 61, 0.4)'];
                const greenBorders = ['#4ade80', '#22c55e', '#16a34a', '#15803d'];
                
                const reds = ['rgba(248, 113, 113, 0.4)', 'rgba(239, 68, 68, 0.4)', 'rgba(220, 38, 38, 0.4)', 'rgba(185, 28, 28, 0.4)'];
                const redBorders = ['#f87171', '#ef4444', '#dc2626', '#b91c1c'];
                
                let gIdx = 0, rIdx = 0;

                // Extraemos cada ingreso individualmente
                document.querySelectorAll('#ingresos-list .data-row').forEach((row, i) => {
                    const monto = desformatearMoneda(row.querySelector('.input-ingreso').value);
                    if (monto > 0) {
                        const concepto = row.querySelector('.input-concepto').value.trim() || `Ingreso ${i+1}`;
                        labels.push(concepto);
                        chartData.push(monto);
                        bgColors.push(greens[gIdx % greens.length]);
                        borderColors.push(greenBorders[gIdx % greenBorders.length]);
                        gIdx++;
                    }
                });

                // Extraemos cada gasto individualmente
                document.querySelectorAll('#gastos-list .data-row').forEach((row, i) => {
                    const monto = desformatearMoneda(row.querySelector('.input-gasto').value);
                    if (monto > 0) {
                        const concepto = row.querySelector('.input-concepto').value.trim() || `Gasto ${i+1}`;
                        labels.push(concepto);
                        chartData.push(monto);
                        bgColors.push(reds[rIdx % reds.length]);
                        borderColors.push(redBorders[rIdx % redBorders.length]);
                        rIdx++;
                    }
                });

                // Actualizamos el canvas
                if (chartData.length === 0) {
                    chartInstancia.data.labels = ['Sin datos'];
                    chartInstancia.data.datasets[0].data = [0.1];
                    chartInstancia.data.datasets[0].backgroundColor = ['rgba(255,255,255,0.05)'];
                    chartInstancia.data.datasets[0].borderColor = ['rgba(255,255,255,0.1)'];
                } else {
                    chartInstancia.data.labels = labels;
                    chartInstancia.data.datasets[0].data = chartData;
                    chartInstancia.data.datasets[0].backgroundColor = bgColors;
                    chartInstancia.data.datasets[0].borderColor = borderColors;
                }
                chartInstancia.update();
            }
        };

        const onInputMonto = (e) => {
            const valorOriginal = e.target.value;
            const valorNumerico = valorOriginal.replace(/\D/g, '');
            e.target.value = valorNumerico ? formatearMoneda(valorNumerico) : '';
            actualizarTotales();
        };

        const eliminarFila = (btn) => {
            const row = btn.closest('.data-row');
            row.style.opacity = '0';
            row.style.transform = 'scale(0.95)';
            setTimeout(() => {
                row.remove();
                actualizarTotales();
            }, 200);
        };

        const agregarFila = (tipo) => {
            const listId = tipo === 'ingresos' ? 'ingresos-list' : 'gastos-list';
            const inputClass = tipo === 'ingresos' ? 'input-ingreso' : 'input-gasto';
            const placeholderConcepto = tipo === 'ingresos' ? 'Concepto (ej. Salario)' : 'Concepto (ej. Arriendo)';
            const focusColor = tipo === 'ingresos' ? 'focus:border-green-400 focus:shadow-[0_0_8px_rgba(74,222,128,0.3)]' : 'focus:border-red-400 focus:shadow-[0_0_8px_rgba(248,113,113,0.3)]';
            const container = document.getElementById(listId);

            const div = document.createElement('div');
            div.className = 'data-row flex gap-3 items-center transition-all duration-300 break-inside-avoid';
            
            // Se añade la clase 'input-concepto' al input de texto para leerlo más fácil
            div.innerHTML = `
                <input type="text" placeholder="${placeholderConcepto}" class="input-concepto flex-1 p-3 rounded-xl input-futuristic text-sm w-1/2">
                <div class="relative w-5/12">
                    <span class="absolute left-3 top-3 text-slate-500 font-bold">$</span>
                    <input type="text" placeholder="0" class="${inputClass} currency-input w-full p-3 pl-8 rounded-xl input-futuristic text-sm ${focusColor}">
                </div>
                <button onclick="eliminarFila(this)" class="btn-no-pdf w-1/12 flex justify-center text-slate-500 hover:text-red-400 transition-colors p-2" title="Eliminar registro">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            `;

            container.appendChild(div);
            
            // Detectar cambios en los inputs numéricos
            const montoInput = div.querySelector(`.${inputClass}`);
            montoInput.addEventListener('input', onInputMonto);
            
            // Detectar cambios en el nombre del concepto para actualizar la gráfica en tiempo real
            const conceptoInput = div.querySelector('.input-concepto');
            conceptoInput.addEventListener('input', actualizarTotales);

            actualizarTotales();
        };

        // Fecha inicial
        const fechaBalance = document.getElementById('fecha-balance');
        const ahora = new Date();
        fechaBalance.value = `${ahora.getFullYear()}-${String(ahora.getMonth() + 1).padStart(2, '0')}`;

        const obtenerMesAnio = () => {
            if (!fechaBalance.value) return 'Sin fecha';
            const [anio, mes] = fechaBalance.value.split('-');
            const nombresMeses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
                'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            return `${nombresMeses[Number(mes) - 1]} ${anio}`;
        };

        // Inicializar
        inicializarGrafico();
        agregarFila('ingresos');
        agregarFila('gastos');

        // Exportación PDF
        const descargarPDF = () => {
            window.scrollTo(0, 0);

            const elemento = document.getElementById('app-content');
            const body = document.getElementById('main-body');
            
            const displayOriginal = body.style.display;
            const paddingOriginal = body.style.padding;
            
            body.style.display = 'block';
            body.style.padding = '0';
            
            const tituloOriginal = document.title;
            const tituloBalance = `Balance financiero (${obtenerMesAnio()})`;
            const tituloPDF = document.createElement('h2');
            tituloPDF.id = 'titulo-pdf-balance';
            tituloPDF.textContent = tituloBalance;
            tituloPDF.className = 'text-2xl font-bold text-center mb-6 text-slate-100 mt-2 break-inside-avoid';
            elemento.insertBefore(tituloPDF, elemento.children[1]);

            const botones = document.querySelectorAll('.btn-no-pdf');
            botones.forEach(btn => btn.classList.add('pdf-ocultar'));
            
            const inputs = elemento.querySelectorAll('input');
            const inputsReemplazados = [];
            
            inputs.forEach(input => {
                const span = document.createElement('span');
                const valorText = input.value || (input.placeholder !== '0' ? '---' : '$0');
                span.textContent = input.classList.contains('currency-input') && input.value ? '$' + input.value : valorText;
                
                span.className = 'inline-block bg-slate-800/50 rounded-xl text-slate-200 py-2.5 px-4 font-medium w-full truncate border border-slate-700 ' + 
                                (input.classList.contains('currency-input') ? 'text-right' : 'text-left');
                
                const contenedorOriginal = input.parentNode;
                if(contenedorOriginal.classList.contains('relative')){
                    const signo = contenedorOriginal.querySelector('span.absolute');
                    if (signo) signo.style.display = 'none';
                }

                input.parentNode.insertBefore(span, input);
                input.style.display = 'none';
                inputsReemplazados.push({input, span, contenedorOriginal});
            });

            elemento.classList.add('pdf-export-mode');

            setTimeout(() => {
                const opt = {
                    margin:       [8, 8, 8, 8], 
                    filename:     `Balance_financiero_${obtenerMesAnio().replace(/\s+/g, '_')}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] },
                    html2canvas:  { 
                        scale: 1.5, 
                        useCORS: true,
                        backgroundColor: '#020617'
                    },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                
                html2pdf().set(opt).from(elemento).save().then(() => {
                    body.style.display = displayOriginal;
                    body.style.padding = paddingOriginal;
                    
                    elemento.classList.remove('pdf-export-mode');
                    document.title = tituloOriginal;
                    document.getElementById('titulo-pdf-balance')?.remove();
                    botones.forEach(btn => btn.classList.remove('pdf-ocultar'));
                    inputsReemplazados.forEach(item => {
                        item.input.style.display = '';
                        item.span.remove();
                        if(item.contenedorOriginal.classList.contains('relative')){
                            const signo = item.contenedorOriginal.querySelector('span.absolute');
                            if (signo) signo.style.display = '';
                        }
                    });
                });
            }, 100);
        };
    </script>
</body>
</html>
